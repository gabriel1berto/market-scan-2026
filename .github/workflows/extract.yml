name: Extração PNCP

on:
  workflow_dispatch:
    inputs:
      uf:
        description: "UF(s) a extrair, separadas por vírgula (padrão: as 26 UFs restantes — RJ já completo)"
        required: false
        default: "AC,AL,AP,AM,BA,CE,DF,ES,GO,MA,MT,MS,MG,PA,PB,PR,PE,PI,RN,RS,RO,RR,SC,SP,SE,TO"
      meses:
        description: "Meses de 2026 a rodar (subset de 01,02,03,04,05,06), separados por vírgula"
        required: false
        default: "01,02,03,04,05,06"

jobs:
  montar-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.filtro.outputs.matrix }}
    steps:
      - id: filtro
        run: |
          python3 - <<'PY'
          import json, os

          meses_todos = [
              {"numero": "01", "inicio": "20260101", "fim": "20260131"},
              {"numero": "02", "inicio": "20260201", "fim": "20260228"},
              {"numero": "03", "inicio": "20260301", "fim": "20260331"},
              {"numero": "04", "inicio": "20260401", "fim": "20260430"},
              {"numero": "05", "inicio": "20260501", "fim": "20260531"},
              {"numero": "06", "inicio": "20260601", "fim": "20260630"},
          ]
          ufs = [u.strip() for u in "${{ github.event.inputs.uf }}".split(",") if u.strip()]
          meses_pedidos = {m.strip() for m in "${{ github.event.inputs.meses }}".split(",") if m.strip()}
          meses_sel = [m for m in meses_todos if m["numero"] in meses_pedidos]

          # combinação UF x mês — cada uma vira 1 job da matrix. 26 UFs x 6 meses = 156,
          # dentro do teto de 256 combinações que o GitHub Actions aceita numa matrix só.
          combos = [{"uf": uf, "mes": mes} for uf in ufs for mes in meses_sel]

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"matrix={json.dumps({'combo': combos})}\n")
          PY

  extrair:
    needs: montar-matrix
    strategy:
      fail-fast: false
      # achado 28/jul/2026: 26 UFs x 6 meses gerado numa matrix só precisa de teto de
      # paralelismo — rodar tudo de uma vez sobrecarregaria a API do PNCP (mesmo motivo
      # pelo qual rodar_resto_brasil.py evitava paralelizar por UF). 6 é o mesmo nível
      # de concorrência já testado com sucesso (matrix de 6 meses de uma UF só rodou
      # sem problema em sessão anterior).
      max-parallel: 6
      matrix: ${{ fromJson(needs.montar-matrix.outputs.matrix) }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Extrair ${{ matrix.combo.uf }} ${{ matrix.combo.mes.inicio }}-${{ matrix.combo.mes.fim }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python extract_pncp.py \
            --uf "${{ matrix.combo.uf }}" \
            --data-inicial "${{ matrix.combo.mes.inicio }}" \
            --data-final "${{ matrix.combo.mes.fim }}"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extract-log-${{ matrix.combo.uf }}-${{ matrix.combo.mes.numero }}
          path: extract_pncp.log
